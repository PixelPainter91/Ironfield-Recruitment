      <stop offset="0%" stop-color="#f4845f"/>
      <stop offset="100%" stop-color="#f5c842"/>
    </linearGradient>
    <linearGradient id="a1v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4845f"/>
      <stop offset="100%" stop-color="#f5c842"/>
    </linearGradient>
  </defs>
  <rect width="540" height="100" fill="#1e1b2e"/>
  <g transform="translate(46,50) rotate(45)">
